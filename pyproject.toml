[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vafsoma"
version = "0.4.3"
description = "Cell-layer-fixed somatic mutations from VAF spectra of layered plant tissue"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ming Zhou"}, {name = "Frank Johannes", email = "frank@johanneslab.org"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "joblib>=1.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vafsoma = "vafsoma.cli:main"

[project.urls]
Homepage = "https://github.com/jlab-code/vafSOMA"

[tool.setuptools]
packages = ["vafsoma"]
